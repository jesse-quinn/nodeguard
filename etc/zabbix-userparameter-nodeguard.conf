# nodeguard agent items. Requires the matching sudoers rule
# (etc/sudoers-nodeguard-zabbix) and, under SELinux enforcing, the
# zabbix_run_sudo boolean. Key: nodeguard.kv[<field>] where <field> is any
# ng.* suffix from nodeguard-status --kv (attached, attach_state,
# killswitch, latch, blocks, port_match, suricata, responder, kernel_drops).
UserParameter=nodeguard.kv[*],sudo /usr/local/sbin/nodeguard-status --kv 2>/dev/null | awk -F= -v k="ng.$1" '$1==k {print $2}'
