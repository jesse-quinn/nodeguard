# nodeguard agent items. The nodeguard watchdog exports a kv snapshot to
# /run/zabbix/nodeguard.kv every minute; the agent only reads the file
# (zabbix_agent_t cannot make bpf() syscalls, and sudo does not change
# the SELinux domain). ng.ts carries the export epoch for staleness.
# NOTE: the agent substitutes $1..$9 with item arguments inside the
# command, so awk's field references must be written as $$1/$$2.
UserParameter=nodeguard.kv[*],awk -F= -v k="ng.$1" '$$1==k {print $$2}' /run/zabbix/nodeguard.kv 2>/dev/null
