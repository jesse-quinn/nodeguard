# Owned by nodeguard's deploy (replaces the RPM's noreplace config and any
# stale pre-existing rotation for /var/log/suricata). Rename-based
# rotation, never copytruncate: the responder follows across renames and
# copytruncate loses lines.
/var/log/suricata/*.log /var/log/suricata/*.json {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        suricatasc -c reopen-log-files >/dev/null 2>&1 || systemctl kill -s HUP suricata 2>/dev/null || true
    endscript
}
