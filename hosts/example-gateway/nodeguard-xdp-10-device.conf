[Unit]
# SAFETY: Wants= (not Requires=/BindsTo=) so a late NIC delays the attach
# up to the device job timeout, while a missing device never stops the
# unit: nodeguard-attach then fails loudly and the host runs open.
Wants=sys-subsystem-net-devices-eth0.device
After=sys-subsystem-net-devices-eth0.device
