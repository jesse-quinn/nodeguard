# SAFETY: ENFORCE=no is the mandatory first-run mode - logs WOULD BLOCK
# only.
ENFORCE=no
EVE=/var/log/suricata/eve.json
JOURNAL=/var/lib/nodeguard/blocks.json
SIDS=/etc/nodeguard/sids.conf
TTL=3600
TTL_MAX=86400
RATE_MIN=30
RATE_HOUR=500
# Networks this host considers local (inbound = dest in HOME_NETS):
HOME_NETS=192.0.2.0/24,100.64.0.0/10
