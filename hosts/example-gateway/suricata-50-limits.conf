# NOTE: PROVISIONAL caps - finalize only after phase 1 measures steady
# RSS and reload-peak RSS (ruleset-reload-nonblocking peaks near twice
# steady).
[Service]
# SAFETY: suricata creates eve.json as root before dropping privileges and
# then cannot reopen it; eve output silently fails while the unit stays
# green (hit on both deployment targets). The + prefix runs as root; touch
# plus chown never truncates an existing file.
ExecStartPre=+/bin/sh -c 'touch /var/log/suricata/eve.json && chown suricata:suricata /var/log/suricata/eve.json'

CPUQuota=400%
MemoryHigh=1536M
MemoryMax=3G
Restart=on-failure
RestartSec=10
